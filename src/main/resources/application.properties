spring.application.name=SGE - Sistema de Gestao de Expedientes
server.port=8080

# Base de dados H2 em ficheiro: nao exige instalacao e mantem os dados entre execucoes.
spring.datasource.url=jdbc:h2:file:./data/sge;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# Consola web da base de dados (reservada ao papel ADMINISTRADOR pelo SecurityConfig).
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Anexos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

spring.thymeleaf.cache=false
spring.mvc.hiddenmethod.filter.enabled=true

logging.level.mz.unisced.sge=INFO
