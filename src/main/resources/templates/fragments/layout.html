<!DOCTYPE html>
<html lang="pt"
      th:fragment="pagina(titulo, conteudo)"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'SGE | ' + ${titulo}">SGE</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>

<header class="navegacao">
    <div class="interior">
        <a class="marca" th:href="@{/}">SGE <span>Sistema de Gestao de Expedientes</span></a>

        <nav>
            <a th:href="@{/}">Painel</a>
            <a th:href="@{/expedientes}" sec:authorize="hasAuthority('EXPEDIENTE_LER')">Expedientes</a>
            <a th:href="@{/utilizadores}" sec:authorize="hasAuthority('UTILIZADOR_LER')">Utilizadores</a>
            <a th:href="@{/papeis}" sec:authorize="hasAuthority('PAPEL_LER')">Papeis e permissoes</a>
            <a th:href="@{/auditoria}" sec:authorize="hasAuthority('AUDITORIA_VER')">Auditoria</a>
            <a th:href="@{/relatorios}" sec:authorize="hasAuthority('RELATORIO_VER')">Relatorios</a>
        </nav>

        <div class="sessao">
            <a th:href="@{/perfil}" class="nome">
                <span th:text="${#authentication.principal.nomeCompleto}">Utilizador</span>
                <span class="papel"
                      th:text="${#strings.setJoin(#authentication.principal.utilizador.papeis, ', ')}">PAPEL</span>
            </a>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="botao secundario pequeno">Terminar sessao</button>
            </form>
        </div>
    </div>
</header>

<main class="conteudo">
    <div class="mensagem sucesso" th:if="${sucesso}" th:text="${sucesso}"></div>
    <div class="mensagem erro" th:if="${erro}" th:text="${erro}"></div>

    <th:block th:replace="${conteudo}"></th:block>
</main>

<footer class="rodape">
    UnISCED &middot; Faculdade de Engenharia e Agricultura &middot; Engenharia de Software &middot; Trabalho de Campo
</footer>

</body>
</html>
